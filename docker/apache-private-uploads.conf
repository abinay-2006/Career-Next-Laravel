<Directory "/var/www/html/public/upload">
    AllowOverride None
    Options -Indexes
    Require all denied
</Directory>

<Directory "/var/www/html/public/upload/photos">
    AllowOverride None
    Options -Indexes
    Require all granted
</Directory>

<Directory "/var/www/html/public/uploads">
    AllowOverride None
    Options -Indexes
    Require all denied
</Directory>

<Directory "/var/www/html/public/uploads/photos">
    AllowOverride None
    Options -Indexes
    Require all granted
</Directory>

# These two existing root-level images are public assets. Match their complete
# URL paths so files with the same basenames in nested directories stay denied.
<LocationMatch "^/uploads/(470X310_1|admin)\.jpg$">
    Require all granted
</LocationMatch>
