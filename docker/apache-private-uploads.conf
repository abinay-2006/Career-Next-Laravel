<Directory "/var/www/html/public/upload">
    AllowOverride None
    Options -Indexes
    Require all denied
</Directory>

<Directory "/var/www/html/public/upload/photos">
    AllowOverride None
    Options -Indexes
    Require all denied

    # Only image formats accepted by the application may be served publicly.
    # FilesMatch applies to basenames in this directory and its descendants.
    <FilesMatch "(?i)\.(?:jpe?g|png|webp)$">
        Require all granted
    </FilesMatch>
</Directory>

<Directory "/var/www/html/public/uploads">
    AllowOverride None
    Options -Indexes
    Require all denied
</Directory>

<Directory "/var/www/html/public/uploads/photos">
    AllowOverride None
    Options -Indexes
    Require all denied

    # Keep legacy public photos available without exposing documents or scripts.
    <FilesMatch "(?i)\.(?:jpe?g|png|webp)$">
        Require all granted
    </FilesMatch>
</Directory>

# These two existing root-level images are public assets. Match their complete
# URL paths so files with the same basenames in nested directories stay denied.
<LocationMatch "^/uploads/(470X310_1|admin)\.jpg$">
    Require all granted
</LocationMatch>
