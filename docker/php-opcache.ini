; OPcache settings for the PHP in this image.
;
; The framework plus its vendor classmap is well past PHP's 10000-file default,
; and past that limit the cache thrashes - bytecode gets dropped and rebuilt
; constantly, which on a container that also serves every stylesheet itself is
; most of the time a request spends waiting before the first byte.

; Sized for a Render starter instance (512 MB) alongside the Apache workers.
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; The code in the image never changes while the container runs and every deploy
; is a new container, so there is nothing for timestamp checking to protect -
; on a container filesystem it costs a stat() on several thousand files.
; The entrypoint rebuilds the framework and view caches before Apache starts,
; so the first request after a deploy reads freshly compiled files.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Laravel reads docblock and attribute metadata out of the source, so comments
; have to stay in the cached bytecode.
opcache.save_comments=1

; CLI processes (the entrypoint, artisan) get their own run and do not need it.
opcache.enable_cli=0
