# Cache headers for the files Apache serves straight out of the image.
#
# Without them every page view re-requests the whole stylesheet and script stack
# from the container - the role layouts link around thirty of these, each one a
# round trip to the single Render instance, which is most of what a browser waits
# for after the HTML has already arrived. mod_headers is already enabled, and
# Cache-Control alone is what Cloudflare and the browser both honour.

<IfModule mod_headers.c>
    # Vite names these after their contents, so a change produces a new URL and
    # the old response can be held indefinitely.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # These are edited in place, so keep the window short: long enough that
    # clicking through the site stops refetching them, short enough that a CSS
    # change reaches the live site without waiting for a deploy.
    <LocationMatch "^/(?:assets/|images/|style\.css|favicon\.ico)">
        Header set Cache-Control "public, max-age=3600"
    </LocationMatch>
</IfModule>
